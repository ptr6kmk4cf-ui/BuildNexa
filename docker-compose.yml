services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-project-optimizer-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: optimizer
      POSTGRES_PASSWORD: optimizer
      POSTGRES_DB: ai_project_optimizer
    volumes:
      - ai_project_optimizer_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optimizer -d ai_project_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_project_optimizer_pg:
